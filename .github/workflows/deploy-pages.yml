# Builds and publishes the site to GitHub Pages on every push to main.
# Nothing runs until the repository is pushed and Pages is set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            jds-batch8/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # typecheck → privacy check (source) → build → privacy check (dist)
      - run: npm run verify
        env:
          # absolute Open Graph image URL for link previews
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}/
      # JDS Batch 8 recruitment assessment, published at <site>/jds-batch8/.
      # typecheck → unit/UI tests → build → public-build gate (no private key, CSP, relative paths)
      - run: npm ci
        working-directory: jds-batch8
      - run: npm run verify
        working-directory: jds-batch8
      - name: Add the assessment to the site
        run: cp -r jds-batch8/dist dist/jds-batch8
      # privacy check again on the combined site
      - run: npm run check:dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
